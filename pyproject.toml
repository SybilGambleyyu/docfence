[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docfence"
version = "0.48.0"
description = "Local-first Word OOXML change assurance for CI and review workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SybilGambleyyu" }]
keywords = ["docx", "docm", "dotx", "dotm", "word", "diff", "review", "ci", "ooxml", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
  "twine>=6.0",
]

[project.scripts]
docfence = "docfence.cli:main"

[project.urls]
Homepage = "https://github.com/SybilGambleyyu/docfence"
Repository = "https://github.com/SybilGambleyyu/docfence"
Issues = "https://github.com/SybilGambleyyu/docfence/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/docfence"]
